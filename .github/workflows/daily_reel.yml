name: Daily Instagram Reel Publisher

on:
  schedule:
    # 08:30 UTC = 2:00 PM IST (Afternoon Slot)
    - cron: '30 8 * * *'
    # 13:30 UTC = 7:00 PM IST (Evening Slot)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force dispatch immediately ignoring time slot and daily quota'
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TZ: 'Asia/Kolkata'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Instagram Session
        env:
          INSTA_SESSION_DATA: ${{ secrets.INSTA_SESSION_JSON }}
        run: |
          mkdir -p ~/.config/stickman_video_director
          python3 -c "
          import os, json, base64
          from pathlib import Path
          sess_p = Path.home() / '.config' / 'stickman_video_director' / 'insta_session.json'
          val = os.environ.get('INSTA_SESSION_DATA', '').strip()
          if not val:
              print('⚠️ INSTA_SESSION_JSON secret is empty or unset.')
          else:
              data = None
              try:
                  data = json.loads(val)
              except Exception:
                  try:
                      data = json.loads(base64.b64decode(val).decode())
                  except Exception as e:
                      print(f'❌ Failed to parse session: {e}')
              if data:
                  with open(sess_p, 'w') as f:
                      json.dump(data, f)
                  sess_p.chmod(0o600)
                  print('✅ Successfully restored Instagram session from secrets.')
              else:
                  print('⚠️ Restored session data is invalid.')
          "

      - name: Pre-Flight Authentication Health Check
        id: auth_check
        env:
          INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
          INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
          INSTA_GRAPH_ACCESS_TOKEN: ${{ secrets.INSTA_GRAPH_ACCESS_TOKEN }}
          INSTA_IG_USER_ID: ${{ secrets.INSTA_IG_USER_ID }}
        run: |
          python3 scripts/insta_local_post.py --check-auth || true

      - name: Dispatch Queued Reel
        env:
          INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
          INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
          INSTA_GRAPH_ACCESS_TOKEN: ${{ secrets.INSTA_GRAPH_ACCESS_TOKEN }}
          INSTA_IG_USER_ID: ${{ secrets.INSTA_IG_USER_ID }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FORCE_INPUT" != "false" ]; then
            echo "🚀 Manual trigger detected: forcing dispatch of next queued reel..."
            python3 scripts/daily_dispatcher.py --force
          else
            python3 scripts/daily_dispatcher.py
          fi

      - name: Commit Queue Updates, Auth Status & Logs
        if: always()
        run: |
          git config --global user.name "Vynox Bot"
          git config --global user.email "bot@vynox.ai"
          git add projects/queue/ projects/archive/ projects/daily_dispatcher.log projects/duplicate_registry.json projects/auth_status.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated daily Reel dispatched & auth synced [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
