name: Daily Instagram Reel Publisher

on:
  schedule:
    # 07:30 UTC = 1:00 PM IST (Afternoon Slot)
    - cron: '30 7 * * *'
    # 13:30 UTC = 7:00 PM IST (Evening Slot)
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACTIONS_RUNNER_FORCE_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instagrapi pillow

      - name: Restore Instagram Session
        env:
          INSTA_SESSION_DATA: ${{ secrets.INSTA_SESSION_JSON }}
        run: |
          mkdir -p ~/.config/stickman_video_director
          python3 -c "import os
          data = os.environ.get('INSTA_SESSION_DATA', '').strip()
          path = os.path.expanduser('~/.config/stickman_video_director/insta_session.json')
          if data:
              with open(path, 'w') as f:
                  f.write(data)
              os.chmod(path, 0o600)
              print('✅ Successfully restored Instagram session from secrets.')
          else:
              print('⚠️ INSTA_SESSION_JSON secret is empty or unset.')"

      - name: Dispatch Queued Reel
        env:
          INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
          INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
        run: |
          python3 scripts/daily_dispatcher.py

      - name: Commit Queue Updates & Logs
        run: |
          git config --global user.name "Vynox Bot"
          git config --global user.email "bot@vynox.ai"
          git add projects/queue/ projects/archive/ projects/daily_dispatcher.log
          git commit -m "Automated daily Reel dispatched [skip ci]" || echo "No changes to commit"
          git push
