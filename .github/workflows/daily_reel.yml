name: Daily Instagram Reel Publisher

on:
  schedule:
    # 08:30 UTC = 2:00 PM IST (Afternoon Slot)
    - cron: '30 8 * * *'
    # 13:30 UTC = 7:00 PM IST (Evening Slot)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force dispatch immediately ignoring time slot and daily quota'
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TZ: 'Asia/Kolkata'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instagrapi pillow

      - name: Restore Instagram Session
        env:
          INSTA_SESSION_DATA: ${{ secrets.INSTA_SESSION_JSON }}
        run: |
          mkdir -p ~/.config/stickman_video_director
          if [ -n "$INSTA_SESSION_DATA" ]; then
            if [[ "$INSTA_SESSION_DATA" =~ ^[[:space:]]*\{ ]]; then
              printf '%s\n' "$INSTA_SESSION_DATA" > ~/.config/stickman_video_director/insta_session.json
            else
              echo "$INSTA_SESSION_DATA" | base64 -d > ~/.config/stickman_video_director/insta_session.json 2>/dev/null || printf '%s\n' "$INSTA_SESSION_DATA" > ~/.config/stickman_video_director/insta_session.json
            fi
            chmod 600 ~/.config/stickman_video_director/insta_session.json
            echo "✅ Successfully restored Instagram session from secrets."
          else
            echo "⚠️ INSTA_SESSION_JSON secret is empty or unset."
          fi

      - name: Dispatch Queued Reel
        env:
          INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
          INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FORCE_INPUT" != "false" ]; then
            echo "🚀 Manual trigger detected: forcing dispatch of next queued reel..."
            python3 scripts/daily_dispatcher.py --force
          else
            python3 scripts/daily_dispatcher.py
          fi

      - name: Commit Queue Updates & Logs
        run: |
          git config --global user.name "Vynox Bot"
          git config --global user.email "bot@vynox.ai"
          git add projects/queue/ projects/archive/ projects/daily_dispatcher.log
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated daily Reel dispatched [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
