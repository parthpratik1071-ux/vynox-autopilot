name: Instagram DM Auto-Responder (@pratikparth_12)

on:
  schedule:
    # Runs every 15 minutes 24/7 in GitHub cloud (without laptop on)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (inspect only, do not send reactions or replies)'
        required: false
        type: boolean
        default: false

jobs:
  auto_respond:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instagrapi Pillow curl_cffi pycryptodomex

      - name: Run NexoraAI DM Responder
        env:
          INSTA_SESSION_PRATIKPARTH_JSON: ${{ secrets.INSTA_SESSION_PRATIKPARTH_JSON || secrets.INSTA_SESSION_PRATIKPARTH }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python3 scripts/dm_auto_reply_pratikparth.py $ARGS

      - name: Commit & Push Seen Message State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/dm_seen_pratikparth.json || true
          if git commit -m "chore(dm): update seen message state for @pratikparth_12 [skip ci]"; then
            git pull --rebase origin main
            git push origin main
            echo "✅ State updated and committed."
          else
            echo "No state changes to commit."
          fi
