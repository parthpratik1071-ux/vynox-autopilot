name: Instagram DM Auto-Responder (@pratikparth_12)

on:
  schedule:
    # Safety backup cron every 30 minutes in case a chain run stops
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (inspect only, do not send reactions or replies)'
        required: false
        type: boolean
        default: false
      loop_minutes:
        description: 'Minutes to keep monitoring inbox continuously (default: 45)'
        required: false
        type: number
        default: 45

# Prevent concurrent overlapping runs from colliding on the Instagram session
concurrency:
  group: instagram_dm_pratikparth
  cancel-in-progress: false

jobs:
  auto_respond:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instagrapi Pillow curl_cffi pycryptodomex

      - name: Run NexoraAI 24/7 DM Monitor
        env:
          INSTA_SESSION_PRATIKPARTH_JSON: ${{ secrets.INSTA_SESSION_PRATIKPARTH_JSON || secrets.INSTA_SESSION_PRATIKPARTH }}
        run: |
          LOOP=45
          if [ -n "${{ github.event.inputs.loop_minutes }}" ]; then
            LOOP="${{ github.event.inputs.loop_minutes }}"
          fi
          ARGS="--loop-minutes $LOOP"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/dm_auto_reply_pratikparth.py $ARGS

      - name: Commit & Push State Changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/dm_seen_pratikparth.json projects/dm_recent_replies.json || true
          if git commit -m "chore(dm): update seen state & human anti-repetition memory [skip ci]"; then
            git pull --rebase origin main
            git push origin main
            echo "✅ State updated and committed."
          else
            echo "No state changes to commit."
          fi

      - name: Chain Next Continuous 24/7 Run
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Launching next continuous monitor session..."
          gh workflow run dm_auto_reply_pratikparth.yml || true
