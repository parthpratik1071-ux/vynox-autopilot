name: Instagram DM Multi-Account Auto-Responder Hub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (inspect only, do not send reactions or replies)'
        required: false
        type: boolean
        default: true
      loop_minutes:
        description: 'Minutes to keep monitoring inbox'
        required: false
        type: number
        default: 5

# Cancel any running workflow in this group immediately on push
concurrency:
  group: instagram_dm_hub
  cancel-in-progress: true

jobs:
  emergency_stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write

    steps:
      - name: Cancel All In-Progress & Queued Runs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "🛑 Emergency STOP requested: Halting all active GitHub Actions..."
          gh run list --json databaseId,status,name -q '.[] | select(.status != "completed") | .databaseId' | while read -r id; do
            if [ -n "$id" ] && [ "$id" != "$GITHUB_RUN_ID" ]; then
              echo "Cancelling run ID: $id"
              gh run cancel "$id" || true
            fi
          done
          echo "Disabling automatic triggers..."
          gh workflow disable dm_auto_reply_pratikparth.yml || true
          echo "✅ All GitHub workflows halted and disabled."
