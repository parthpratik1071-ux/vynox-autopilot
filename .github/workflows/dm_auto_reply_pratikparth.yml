name: Instagram DM Multi-Account Auto-Responder Hub

on:
  schedule:
    # Backup cron every 15 minutes in case a loop completes or delays
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (inspect only, do not send reactions or replies)'
        required: false
        type: boolean
        default: false
      loop_minutes:
        description: 'Minutes to keep monitoring inbox continuously (default: 45)'
        required: false
        type: number
        default: 45

# Prevent concurrent overlapping runs from colliding on the Instagram session
concurrency:
  group: instagram_dm_hub
  cancel-in-progress: false

jobs:
  auto_respond:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instagrapi Pillow curl_cffi pycryptodomex imageio-ffmpeg SpeechRecognition edge-tts

      - name: Restore Multi-Account Instagram Sessions
        env:
          INSTA_SESSION_PRATIKPARTH: ${{ secrets.INSTA_SESSION_PRATIKPARTH_JSON || secrets.INSTA_SESSION_PRATIKPARTH }}
          INSTA_SESSION_VYNOX: ${{ secrets.INSTA_SESSION_JSON || secrets.INSTA_SESSION }}
        run: |
          mkdir -p ~/.config/stickman_video_director
          if [ -n "$INSTA_SESSION_PRATIKPARTH" ]; then
            P_PATH="$HOME/.config/stickman_video_director/insta_session_pratikparth_12.json"
            printf '%s\n' "$INSTA_SESSION_PRATIKPARTH" > "$P_PATH"
            if ! python3 -c "import json; json.load(open('$P_PATH'))" 2>/dev/null; then
              echo "$INSTA_SESSION_PRATIKPARTH" | base64 -d > "$P_PATH" 2>/dev/null || true
            fi
            chmod 600 "$P_PATH" 2>/dev/null || true
            echo "✅ Session restored for @pratikparth_12"
          else
            echo "⚠️ Secret INSTA_SESSION_PRATIKPARTH_JSON not found in repository secrets."
          fi
          if [ -n "$INSTA_SESSION_VYNOX" ]; then
            V_PATH="$HOME/.config/stickman_video_director/insta_session.json"
            printf '%s\n' "$INSTA_SESSION_VYNOX" > "$V_PATH"
            if ! python3 -c "import json; json.load(open('$V_PATH'))" 2>/dev/null; then
              echo "$INSTA_SESSION_VYNOX" | base64 -d > "$V_PATH" 2>/dev/null || true
            fi
            chmod 600 "$V_PATH" 2>/dev/null || true
            echo "✅ Session restored for @vynox_00000"
          else
            echo "⚠️ Secret INSTA_SESSION_JSON not found in repository secrets."
          fi

      - name: Run NexoraAI 24/7 Multi-Account DM Monitor
        env:
          INSTA_SESSION_PRATIKPARTH_JSON: ${{ secrets.INSTA_SESSION_PRATIKPARTH_JSON || secrets.INSTA_SESSION_PRATIKPARTH }}
          INSTA_SESSION_JSON: ${{ secrets.INSTA_SESSION_JSON || secrets.INSTA_SESSION }}
        run: |
          LOOP=45
          if [ -n "${{ github.event.inputs.loop_minutes }}" ]; then
            LOOP="${{ github.event.inputs.loop_minutes }}"
          fi
          ARGS="--loop-minutes $LOOP"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/dm_auto_reply_hub.py $ARGS

      - name: Commit & Push State Changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/dm_seen_*.json projects/dm_recent_replies_*.json || true
          if git commit -m "chore(dm): update multi-account seen states & history [skip ci]"; then
            git pull --rebase origin main
            git push origin main
            echo "✅ State updated and committed."
          else
            echo "No state changes to commit."
          fi

      - name: Chain Next Continuous 24/7 Run
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Launching next continuous monitor session..."
          gh workflow run dm_auto_reply_pratikparth.yml || true
