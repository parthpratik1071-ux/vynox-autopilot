name: Daily Trending Reel Discovery & Production

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST (Morning Discovery Slot)
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  trend_producer:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TZ: 'Asia/Kolkata'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Trending Reel Producer
        run: |
          python3 scripts/daily_trend_producer.py

      - name: Commit & Push New Reels and Queue Updates
        run: |
          git config --global user.name "Vynox Trend Bot"
          git config --global user.email "trendbot@vynox.ai"
          git add projects/queue/ projects/series-romantic-animations/ projects/trend_producer.log
          if git diff --cached --quiet; then
            echo "No new trends or reels to commit."
          else
            git commit -m "Auto-discovered & staged trending romantic Reel [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
