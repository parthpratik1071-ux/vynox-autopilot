name: Vynox Reels Booster

on:
  schedule:
    # Runs 3x/day during waking IST hours (~every 5-6 hours, zero DM polling):
    # 04:00 UTC = 09:30 AM IST | 10:00 UTC = 03:30 PM IST | 15:00 UTC = 08:30 PM IST
    - cron: '0 4,10,15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (inspect only, do not post comments or likes)'
        required: false
        type: boolean
        default: false

concurrency:
  group: vynox_reels_booster
  cancel-in-progress: false

jobs:
  boost:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TZ: 'Asia/Kolkata'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Vynox Instagram Session
        env:
          INSTA_SESSION_DATA: ${{ secrets.INSTA_SESSION_JSON }}
        run: |
          mkdir -p ~/.config/stickman_video_director
          python3 - <<'PYEOF'
          import base64, json, os, sys
          from pathlib import Path

          sess_p = Path.home() / '.config' / 'stickman_video_director' / 'insta_session.json'
          val = os.environ.get('INSTA_SESSION_DATA', '').strip()
          if not val:
              print('INSTA_SESSION_JSON secret is empty or unset.')
              sys.exit(1)

          data = None
          try:
              data = json.loads(val)
          except Exception:
              try:
                  data = json.loads(base64.b64decode(val).decode())
              except Exception as e:
                  print(f'Failed to parse session JSON: {e}')
                  sys.exit(1)

          with open(sess_p, 'w') as f:
              json.dump(data, f)
          sess_p.chmod(0o600)
          print('Restored @vynox_00000 session for Reels Booster.')
          PYEOF

      - name: Run Standalone Reels Booster
        env:
          INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
          INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
        run: |
          ARGS="--max-likes 5"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/reels_booster.py $ARGS

      - name: Commit Boosted State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/reels_boosted.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(booster): update boosted reel IDs [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          else
            echo "No booster state changes to commit."
          fi
